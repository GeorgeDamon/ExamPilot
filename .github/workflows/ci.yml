name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browser
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]' build
      - name: Install official Chromium
        run: python -m playwright install chromium
      - name: Static checks
        run: |
          ruff check autoexam tests scripts
          ruff format --check autoexam tests scripts
          python scripts/check_public_tree.py
      - name: Run synthetic tests (no platform credentials)
        run: python -m pytest -q
      - name: Simulate a lost submission response
        run: exampilot demo --lost-response
      - name: Build distributable packages
        run: python -m build
