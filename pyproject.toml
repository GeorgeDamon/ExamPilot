[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-pilot"
version = "0.1.0a1"
description = "ExamPilot: scoped Chaoxing exam monitoring and DeepSeek answer automation"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "GeorgeDamon"}]
keywords = ["chaoxing", "deepseek", "macos", "exam", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3", "PyYAML>=6,<7", "beautifulsoup4>=4.12,<5", "playwright>=1.48,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
exampilot = "autoexam.cli:main"
autoexam = "autoexam.cli:main"

[project.urls]
Repository = "https://github.com/GeorgeDamon/ExamPilot"
Issues = "https://github.com/GeorgeDamon/ExamPilot/issues"

[tool.setuptools.package-data]
autoexam = ["resources/*.yaml", "resources/*.example"]

[tool.setuptools.packages.find]
include = ["autoexam*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

